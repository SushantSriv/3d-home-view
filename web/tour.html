<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>360° Home Tour</title>
  <meta name="description" content="Walk through this property in 360 degrees. No login, no app.">
  <meta name="theme-color" content="#0E1013">
  <meta name="color-scheme" content="dark">

  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">

  <meta property="og:site_name" content="360° Home Tour">
  <meta property="og:title" content="360° Home Tour">
  <meta property="og:description" content="Walk through this property in 360 degrees. No login, no app.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="img/og-default.png">
  <meta name="twitter:card" content="summary_large_image">

  <!-- The tour JSON is one round trip to Supabase and it is the very first
       thing this page needs; opening the connection early is free. -->
  <link rel="preconnect" href="https://ikuovilpewamyareelqm.supabase.co" crossorigin>

  <link rel="stylesheet" href="css/app.css">

  <!-- The preload scanner does not walk an import graph, so the four modules
       every visit needs are named here. Pannellum is deliberately NOT: four of
       the exits from this page are text-only and never need 66 kB of viewer,
       so it is fetched from inside mountViewer() instead. -->
  <link rel="modulepreload" href="js/tour.js">
  <link rel="modulepreload" href="js/floorplan.js">
  <link rel="modulepreload" href="js/scale.js">
  <link rel="modulepreload" href="js/config.js">

</head>
<body class="viewer">

<main class="viewer-shell solo" id="shell">
  <!-- The page's real heading. It is the property name, and it is the same
       string as the document title; it is out of sight because on this page
       the heading's job is done by the photograph. -->
  <h1 class="visually-hidden" id="doc-h1">360° Home Tour</h1>

  <div class="stage" id="stage">
    <div id="pano"></div>

    <!-- Ends of the sweep. A phone panorama stops around 230°, and these fade
         in as the buyer reaches that edge so it reads as the end of the photo
         rather than as a broken page. -->
    <div class="edge-scrim l" id="scrim-l" aria-hidden="true"></div>
    <div class="edge-scrim r" id="scrim-r" aria-hidden="true"></div>

    <div id="tag" class="tour-tag glass hidden" aria-live="polite"></div>

    <div id="actions" class="tour-actions hidden">
      <button id="measure-btn" class="btn sm" type="button" aria-pressed="false"
              title="Measure distances on the floor (M)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M3 15.5 8.5 21 21 8.5 15.5 3Z"/>
          <path d="M7 11.5 8.75 13.25M10.5 8 12.25 9.75M14 4.5 15.75 6.25"/>
        </svg>
        <span class="lbl">Measure</span>
      </button>

      <button id="next" class="btn sm" type="button" title="Next room (N)">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M5 12h13"/><path d="m13 6 6 6-6 6"/>
        </svg>
        <span class="lbl">Next room</span>
      </button>

      <button id="share" class="btn sm" type="button" title="Share this tour">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="18" cy="5.5" r="2.6"/><circle cx="6" cy="12" r="2.6"/>
          <circle cx="18" cy="18.5" r="2.6"/>
          <path d="m8.4 10.7 7.2-3.9M8.4 13.3l7.2 3.9"/>
        </svg>
        <span class="lbl">Share</span>
      </button>

      <button id="fullscreen" class="btn sm" type="button" aria-pressed="false"
              aria-label="Full screen" title="Full screen">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
    </div>

    <details id="dock" class="tour-dock glass hidden" open>
      <summary>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3.5" y="3.5" width="17" height="17" rx="1.5"/>
          <path d="M3.5 13h6m0-9.5V21M15 13h5.5M15 9.5V21"/>
        </svg>
        <span class="label" id="dock-label">Floor plan</span>
      </summary>
      <div class="body">
        <div id="plan" class="floorplan"></div>
      </div>
    </details>

    <!-- Distance readout: filled in when someone taps the floor. -->
    <div id="measure" class="tour-measure glass hidden" aria-live="polite"></div>

    <!-- First paint, with no JavaScript at all. Removed the moment the viewer
         reports the panorama loaded. -->
    <div id="boot" class="tour-boot">
      <svg class="mark" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M20.16 8.20 A 9 9 0 1 1 15.80 3.84" stroke="currentColor" stroke-width="2"
              stroke-linecap="round"/>
        <circle cx="12" cy="12" r="2.6" fill="currentColor"/>
      </svg>
      <p>Loading this home…</p>
    </div>

    <div id="msg" class="tour-msg hidden">
      <div id="msg-inner" class="inner"></div>
    </div>
  </div>

  <!-- The shelf under the stage on an upright phone: the room switcher, and
       the floor plan moved down out of the picture. Hidden everywhere else. -->
  <nav class="tour-bar hidden" id="bar" aria-label="Rooms">
    <div class="chipbar" id="chips"></div>
  </nav>
</main>

<script type="module" src="js/tour.js"></script>
</body>
</html>
