<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Studio &mdash; 360&deg; Home Tour</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>

  <header class="topbar">
    <a class="brand" href="index.html">360<b>&deg;</b> Home Tour</a>
    <nav>
      <a class="btn sm" href="tour.html?demo=1">Demo</a>
      <a class="btn sm" href="index.html">Home</a>
    </nav>
  </header>

  <main class="wrap">
    <h1>Studio</h1>

    <div id="setup" class="banner hidden"></div>
    <div id="flash" class="banner hidden"></div>

    <div id="app" class="hidden">

      <!-- Property picker ------------------------------------------------ -->
      <div class="card">
        <div class="row">
          <div>
            <label for="prop-select">Property</label>
            <select id="prop-select"></select>
          </div>
          <div class="none">
            <button id="prop-new" class="btn">New property</button>
          </div>
        </div>

        <form id="new-form" class="hidden" style="margin-top:.9rem">
          <hr class="sep">
          <div class="row">
            <div class="field"><label for="new-name">Name</label>
              <input id="new-name" type="text" placeholder="Solsiden 12B" required></div>
            <div class="field"><label for="new-address">Address (optional)</label>
              <input id="new-address" type="text" placeholder="0192 Oslo"></div>
          </div>
          <button class="btn primary" type="submit">Create</button>
          <button id="new-cancel" class="btn" type="button">Cancel</button>
        </form>
      </div>

      <!-- Editor ---------------------------------------------------------- -->
      <div id="editor" class="hidden">
        <div class="studio-grid">

          <!-- left: plan -->
          <section>
            <div class="card">
              <div class="spread" style="margin-bottom:.7rem">
                <h2 class="grow" style="margin:0">Floor plan</h2>
                <button id="add-room" class="btn sm">Add room</button>
              </div>
              <p id="plan-hint" class="muted" style="margin:0 0 .6rem">
                Upload a floor plan, then press <em>Add room</em> and click where the room is.
                Drag a pin to move it.
              </p>
              <div id="plan" class="floorplan"></div>
              <div class="field" style="margin-top:.7rem">
                <label for="plan-file">Replace floor plan (PNG or JPG)</label>
                <input id="plan-file" type="file" accept="image/*">
              </div>
            </div>

            <div class="card">
              <h2>Share</h2>
              <div class="spread" style="margin-bottom:.6rem">
                <label class="grow" style="margin:0;display:flex;gap:.5rem;align-items:center;cursor:pointer">
                  <input id="publish" type="checkbox" style="width:auto">
                  <span>Published &mdash; anyone with the link can view</span>
                </label>
              </div>
              <div class="mono" id="share-url">&mdash;</div>
              <div style="margin-top:.6rem">
                <button id="share-copy" class="btn sm">Copy link</button>
                <a id="share-open" class="btn sm" target="_blank" rel="noopener">Open tour</a>
              </div>
            </div>

            <div class="card">
              <h2>Property</h2>
              <div class="row">
                <div class="field"><label for="p-name">Name</label><input id="p-name" type="text"></div>
                <div class="field"><label for="p-address">Address</label><input id="p-address" type="text"></div>
              </div>
              <button id="p-save" class="btn sm">Save</button>
              <button id="p-delete" class="btn sm danger" style="float:right">Delete property</button>
            </div>
          </section>

          <!-- right: rooms -->
          <section>
            <div class="card">
              <div class="spread" style="margin-bottom:.7rem">
                <h2 class="grow" style="margin:0">Rooms</h2>
                <button id="refresh" class="btn sm">Refresh</button>
              </div>
              <div id="rooms"></div>
            </div>
          </section>

        </div>
      </div>
    </div>
  </main>

  <script type="module" src="js/studio.js"></script>
</body>
</html>
