# Stitching defaults tuned for a handheld phone pan of a room.
#
# This is a TEMPLATE. stitch_room.py copies it, fills in `video` and `output_dir`
# with absolute paths, applies any CLI overrides, and writes the result next to
# the output. Upstream's own example config lives in
# third_party/360-spherical-stitching/config.yaml and is aimed at tripod photos --
# the values below differ from it deliberately, and why is written down each time.

# Filled in by stitch_room.py -- do not set here.
video: null
output_dir: null

video_extraction:
  # Upstream defaults to `interval` with frame_interval 2, which on a 25 s clip at
  # 30 fps yields ~375 frames: minutes of matching for no extra quality. `uniform`
  # gives the same frame count regardless of how long the seller's clip happens
  # to be, which keeps runtime predictable.
  method: uniform
  # 36 frames over a full turn is one frame every 10 deg. Against a ~39 deg
  # portrait field of view that is still ~74% overlap, which is plenty for a
  # handheld pan. Measured: 48 frames at 4096 px took 77 s, 36 at 3072 took 51 s,
  # and the two panoramas are visually indistinguishable. Waiting is the worst
  # part of this product, so the time is worth more than the margin.
  num_frames: 36
  frame_interval: 2      # unused with `uniform`, kept so the key exists
  extract_fps: 4.0       # unused with `uniform`

output:
  # 3072x1536. A single-height pan only fills a horizontal band of this anyway,
  # and dropping from 4096 saved 18 s per room with no visible difference at the
  # field of view Pannellum actually renders.
  pano_width: 3072
  output_format: jpg     # the wrapper looks for output_dir/panorama.<format>
  jpg_quality: 90        # 95 roughly doubles the file for no visible gain at this resolution
  # 0 = one thread per core. Each worker holds a full warped frame in memory
  # (~25 MB at 4096 px), so drop this to 2 on a small machine that starts swapping.
  warp_workers: 0

matching:
  # Upstream matches at full resolution. Video frames are already soft compared to
  # stills, so matching at 1280 px is nearly as accurate and several times faster.
  match_full_res: false
  match_width: 1280
  # 200 inliers is a high bar for a blank Scandinavian wall. 90 still rejects
  # genuinely bad pairs while tolerating a plain painted room.
  min_inliers: 90
  ratio_test_threshold: 0.72
  symmetric_matching: false
  ransac_refinement: true
  ransac_max_iters: 6000
  # Rolling-shutter video frames have less contrast than stills; CLAHE buys real
  # features back in dim rooms at a small cost.
  use_clahe: true
  # A room pan is supposed to come back to where it started. Letting the pipeline
  # detect that closure cancels accumulated drift, which is what stops the two
  # ends of the panorama disagreeing. Set true if the seller only panned part way.
  disable_circular_closure: false
  # MEASURED, do not raise this casually. Upstream smooths by averaging rotation
  # MATRICES across the window, which is only valid while the rotations in it are
  # small. Their example uses 17 because their `interval` extraction yields ~375
  # frames at ~1 deg apart. We extract 48 frames at ~7.5 deg apart, where a window
  # of 17 averages across +/-60 deg of yaw and collapses the sweep: measured 21.6%
  # coverage and heavy ghosting at 17, versus 362 deg of recovered rotation and a
  # clean stitch at 3. The right value scales with degrees-per-frame, not frames.
  rotation_smoothing_window: 3

intrinsics:
  # NOTE: stitch_room.py normally overwrites this per video, deriving the true
  # horizontal FOV from the frame's shape (see horizontal_fov()). The value here
  # is the landscape fallback and what `--hfov` replaces if you set it by hand.
  #
  # THE most important knob, and it is the HORIZONTAL field of view of the frame
  # as recorded - which depends on how the phone was held.
  #
  #   landscape 16:9  -> ~64   (vertical fov ~39, covers a +/-19 deg band = 33% of the sphere)
  #   portrait  9:16  -> ~39   (vertical fov ~64, covers a +/-32 deg band = 53% of the sphere)
  #
  # Measured on the synthetic test pan: landscape reached 22% panorama coverage,
  # portrait 36% from the identical scene. Sellers should be told to hold the
  # phone UPRIGHT; it is the single cheapest quality win available.
  #
  # Upstream ships 42, which suits still photos - phone video is cropped tighter
  # than the same phone's stills. If the panorama repeats itself, lower this;
  # if the two ends do not meet, raise it.
  hfov_deg: 64
  calib_json: null

blending:
  # Upstream defaults to `none`, which leaves visible steps wherever the phone's
  # auto-exposure shifted mid-pan -- and it always does, panning past a window.
  method: multiband
  multiband_levels: 5
  multiband_sigma: 3.0
  feather_sigma: 0.0
  sharp_blend_width: 1.0

debug:
  enabled: false
  save_matches: false
  save_warped_frames: 0
  save_seams: false
  verbose_logging: true
